{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Job Running</title>
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/general.css' %}">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-color: #f8f9fa;
        }

        h1 {
            color: #007bff;
            text-align: center;
            margin-top: 20px;
        }

        p {
            text-align: center;
            font-size: 1.2em;
            margin-top: 10px;
        }

        #uploadStatus {
            text-align: center;
            font-size: 1.1em;
            color: #333;
            margin-top: 20px;
        }
    </style>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const jobId = window.location.pathname.split('/').filter(Boolean).pop();
        const statusDiv = document.getElementById('uploadStatus');
        const titleH1 = document.querySelector('h1');

        if (!jobId) {
            statusDiv.innerText = 'No job ID provided.';
            return;
        }

        function checkStatus() {
            fetch(`/results/check_job_status/?job_id=${jobId}`)
                .then(response => {
                    if (!response.ok) {
                        statusDiv.innerText = "Waiting for the creation of the necessary files...";
                        setTimeout(checkStatus, 5000);
                        return;
                    }
                    return response.json();
                })
                .then(data => {
                    if (!data) return;

                    if (data.status === 'finished') {
                        window.location.href = data.redirect_url;
                    } else if (data.status === 'error') {
                        titleH1.innerText = 'Job Stopped';
                        statusDiv.innerHTML = `<strong>Error:</strong> ${data.message}`;
                    } else if (data.status === 'warning') {
                        titleH1.innerText = 'Job Stopped';
                        statusDiv.innerHTML = `<strong>Warning:</strong> ${data.message} <br>
                                               The job was not executed. Please provide a suitable MSA.`;
                    } else {
                        // In progress
                        statusDiv.innerHTML = `Your job ID is <u>${jobId}</u>.<br>
                                               The job is running. <br>
                                               <u>DO NOT refresh or close the page.</u><br>
                                               <b>Status:</b> ${data.status}`;
                        setTimeout(checkStatus, 5000); // recheck in 5s
                    }
                })
                .catch(error => {
                    statusDiv.innerText = `Error checking job status: ${error.message}`;
                    setTimeout(checkStatus, 5000); // recheck in 5s
                });
        }

        checkStatus(); // first check
    });
    </script>
</head>
<body>
    <h1>Job in progress...</h1>
    <p>Please wait, your job is running...</p>
    <div id="uploadStatus">At the end of the process the results will be displayed.</div>
</body>
</html>
